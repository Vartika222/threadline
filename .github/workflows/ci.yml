name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build and verify the extension bundle
        run: npm run build:verify
      - name: Evaluation harness smoke test (offline embedder)
        run: node eval/run.js --trials=5 --sizes=10
